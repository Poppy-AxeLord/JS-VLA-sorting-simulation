# ============================================================================
# metrics.yaml —— 指标体系定义（分层 × 功能四组）
# ----------------------------------------------------------------------------
# 本文件由 src/evaluation/metrics.py 与看板（雷达图 radar_weight）读取。
# 严格对应技术契约 SPEC2 §4（指标体系）。
#
# 分层 layer：北极星 → 核心 → 过程 → 辅助
# 功能四组 group：效果 / 效率 / 稳定性 / 成本
# 每个指标字段：
#   key          英文键（metrics.py 返回 dict 的键，全项目统一）
#   name         中文名
#   layer        北极星 / 核心 / 过程 / 辅助
#   group        效果 / 效率 / 稳定性 / 成本
#   unit         单位
#   formula      计算口径说明（中文）
#   target       目标值（用于看板达标参考）
#   radar_weight 雷达图权重（0~1，0 表示不参与雷达；comparison 页归一化后绘制）
#
# 雷达图维度（comparison.py）：成功率 / 准确率 / 速度 / 稳定性 / 低成本 / 恢复率
# 对应 radar_weight > 0 的指标：
#   task_success_rate(成功率) / sort_accuracy(准确率) / avg_task_ms(速度,逆向) /
#   grasp_success_rate(稳定性) / avg_retry(低成本,逆向) / recovery_rate(恢复率)
# ============================================================================

metrics:

  # ==========================================================================
  # 北极星指标（唯一最高目标，统领全局）
  # ==========================================================================
  - key: "task_success_rate"
    name: "任务成功率"
    layer: "北极星"
    group: "效果"
    unit: "比例"
    formula: "成功任务数 / 总任务数。一个任务全部目标零件按要求正确分拣（exact 全对 / partial 达阈值）才算成功。"
    target: 0.80
    radar_weight: 1.0          # 雷达维度：成功率

  # ==========================================================================
  # 核心指标（效果组）—— 直接衡量分拣质量
  # ==========================================================================
  - key: "sort_accuracy"
    name: "分拣准确率"
    layer: "核心"
    group: "效果"
    unit: "比例"
    formula: "正确分拣零件数 / 目标零件总数。跨所有任务汇总（按零件粒度）。"
    target: 0.85
    radar_weight: 1.0          # 雷达维度：准确率

  - key: "mis_pick_rate"
    name: "误拣率"
    layer: "核心"
    group: "效果"
    unit: "比例"
    formula: "错拣数 / 已拣数。把零件放进错误料盒或拣了不该拣的零件。越低越好。"
    target: 0.08
    radar_weight: 0.0          # 误拣为逆向且与准确率重叠，不单列雷达维度

  - key: "miss_pick_rate"
    name: "漏拣率"
    layer: "核心"
    group: "效果"
    unit: "比例"
    formula: "漏拣数 / 目标零件总数。应分拣却未分拣（遗漏）的零件占比。越低越好。"
    target: 0.10
    radar_weight: 0.0          # 漏拣为逆向且与准确率重叠，不单列雷达维度

  # ==========================================================================
  # 过程指标（效率组）—— 衡量速度与吞吐
  # ==========================================================================
  - key: "avg_task_ms"
    name: "平均任务耗时"
    layer: "过程"
    group: "效率"
    unit: "毫秒"
    formula: "所有任务总耗时(ms) / 任务数。单个任务从 reset 到分拣完成的墙钟耗时。"
    target: 8000
    radar_weight: 1.0          # 雷达维度：速度（逆向指标，归一化时取反）

  - key: "avg_step_ms"
    name: "平均单步耗时"
    layer: "过程"
    group: "效率"
    unit: "毫秒"
    formula: "所有 action 步总耗时(ms) / 总步数。单个 move/grasp/place 动作的平均耗时。"
    target: 600
    radar_weight: 0.0          # 与平均任务耗时相关，不单列雷达维度

  - key: "throughput_per_min"
    name: "单位时间分拣数"
    layer: "过程"
    group: "效率"
    unit: "件/分钟"
    formula: "成功分拣零件总数 / 总耗时(分钟)。反映系统吞吐能力，越高越好。"
    target: 12.0
    radar_weight: 0.0          # 与速度维度相关，雷达由 avg_task_ms 代表

  # ==========================================================================
  # 过程指标（稳定性组）—— 衡量执行可靠性
  # ==========================================================================
  - key: "grasp_success_rate"
    name: "抓取成功率"
    layer: "过程"
    group: "稳定性"
    unit: "比例"
    formula: "抓取成功次数 / 抓取尝试次数。反映执行层（夹爪抓取）的稳定性，越高越好。"
    target: 0.90
    radar_weight: 1.0          # 雷达维度：稳定性

  - key: "recognition_accuracy"
    name: "识别准确率"
    layer: "过程"
    group: "稳定性"
    unit: "比例"
    formula: "正确识别零件数 / 总识别零件数。反映感知层稳定性（受遮挡/相似物影响），越高越好。"
    target: 0.88
    radar_weight: 0.0          # 与稳定性维度相关，雷达由 grasp_success_rate 代表

  - key: "collision_count"
    name: "碰撞次数"
    layer: "过程"
    group: "稳定性"
    unit: "次"
    formula: "评测过程中机械臂发生碰撞的累计次数。越低越好。"
    target: 5
    radar_weight: 0.0          # 计数型逆向指标，不直接进雷达

  - key: "recovery_rate"
    name: "异常恢复率"
    layer: "过程"
    group: "稳定性"
    unit: "比例"
    formula: "成功恢复的异常次数 / 触发异常总次数。碰撞/掉落/识别失败后成功恢复的比例，越高越好。"
    target: 0.60
    radar_weight: 1.0          # 雷达维度：恢复率

  # ==========================================================================
  # 辅助指标（成本组）—— 衡量人工与重试成本
  # ==========================================================================
  - key: "avg_retry"
    name: "平均重试次数"
    layer: "辅助"
    group: "成本"
    unit: "次/任务"
    formula: "所有任务重试总次数 / 任务数。抓放失败后微调姿态重试的平均次数（上限 3），越低越好。"
    target: 0.50
    radar_weight: 1.0          # 雷达维度：低成本（逆向指标，归一化时取反）

  - key: "human_intervention_rate"
    name: "人工介入率"
    layer: "辅助"
    group: "成本"
    unit: "比例"
    formula: "需人工介入的任务数 / 总任务数。置信度过低触发二次确认/人工接管的占比，越低越好。"
    target: 0.10
    # 低成本雷达维度由 avg_retry(radar_weight=1.0) 代表，故此处置 0.0 不重复上雷达；
    # 人工介入率仍在「版本对比」的 delta 分析区与 metrics.py 中完整参与。
    radar_weight: 0.0          # 不单列雷达（低成本维度由 avg_retry 代表）
