# ============================================================================
# env_config.yaml —— 仿真环境配置（场景布局 / 难度 / 物理 / 渲染 / 相机）
# ----------------------------------------------------------------------------
# 本文件由 src/simulation/env.py、objects.py、camera.py 读取。
# 严格对应技术契约 SPEC2 §6（仿真接口）与 §10（配置文件）。
# 所有坐标单位：米（m）；世界坐标系原点在工作台中心，X 向右、Y 向前、Z 向上。
# 设计原则：即使没有 MuJoCo（走 MockPhysics），这些坐标依然用于纯运动学近似
#          与 matplotlib 合成俯视图，因此布局必须自洽、可视化友好。
# ============================================================================

# ----------------------------------------------------------------------------
# 场景布局：传送带 / 工作台 / 三个分拣料盒（A区 / B区 / C区）
# ----------------------------------------------------------------------------
layout:
  # 工作台：机械臂作业的主平面，零件在此被抓取
  workbench:
    name: "工作台"
    # 中心点 [x, y, z]
    center: [0.0, 0.0, 0.0]
    # 台面尺寸 [长(x), 宽(y)]
    size: [1.2, 0.8]
    # 台面高度（机械臂基座参考）
    height: 0.75
    color_name: "工作台灰"     # 渲染用命名色，对应 viz_utils 配色映射

  # 传送带：零件从传送带末端进入工作台待分拣区
  conveyor:
    name: "传送带"
    # 传送带进料端中心
    center: [-0.5, 0.4, 0.0]
    size: [0.4, 0.3]
    # 传送速度（mock 下仅作展示，m/s）
    speed: 0.05
    # 进料区：新零件随机落点的范围 [x_min, x_max, y_min, y_max]
    spawn_area: [-0.45, 0.45, 0.10, 0.40]
    color_name: "传送带深灰"

  # 三个分拣料盒：规则/评分中以 'A'/'B'/'C' 为 key，中文名为 'A区'/'B区'/'C区'
  bins:
    A:
      name: "A区"
      # 料盒中心点（放置目标）
      center: [-0.40, -0.25, 0.0]
      # 料盒投放区域尺寸 [长, 宽]
      size: [0.25, 0.25]
      color_name: "料盒蓝"      # 主蓝系，对应 #2563EB 家族
    B:
      name: "B区"
      center: [0.0, -0.30, 0.0]
      size: [0.25, 0.25]
      color_name: "料盒绿"
    C:
      name: "C区"
      center: [0.40, -0.25, 0.0]
      size: [0.25, 0.25]
      color_name: "料盒橙"

  # 机械臂基座位置（SimpleArm 的 home 参考）
  robot_base: [0.0, -0.55, 0.0]
  # 机械臂 home 姿态末端位置（抓取前/后回归点）
  robot_home: [0.0, -0.30, 0.30]

# ----------------------------------------------------------------------------
# 难度定义：对应 SPEC2 §2 —— 简单3 / 中等5 / 困难8 零件 + 遮挡
# objects.generate_scene(difficulty, seed) 据此采样零件与位姿。
# ----------------------------------------------------------------------------
difficulty:
  # 简单：3 个零件，颜色差异大，无遮挡 —— 基线成功率约 0.85
  简单:
    part_count: 3
    occlusion: false           # 无遮挡
    occlusion_ratio: 0.0       # 被遮挡零件比例
    similar_parts: false       # 不强制放入相似物
    description: "3 个零件，颜色差异大，无遮挡，最易分拣"

  # 中等：5 个零件，含相似物（如螺丝/螺母同为银色），抬高识别错误率 —— 约 0.70
  中等:
    part_count: 5
    occlusion: false
    occlusion_ratio: 0.0
    similar_parts: true        # 强制包含同色相似物（screw/nut/heatsink 等银色族）
    description: "5 个零件，含相似物（同银色族），识别难度上升"

  # 困难：8 个零件，含遮挡（occlusion=true 抬高感知失败率）—— 约 0.55
  困难:
    part_count: 8
    occlusion: true            # 启用遮挡，部分零件 occluded=true
    occlusion_ratio: 0.25      # 约 1/4 零件被遮挡
    similar_parts: true
    description: "8 个零件，含遮挡与相似物，感知/规划压力最大"

# ----------------------------------------------------------------------------
# 物理参数：MuJoCo 与 MockPhysics 共用的世界参数
# （Mock 下重力/摩擦仅用于概率成功模型的微调，不做真实积分）
# ----------------------------------------------------------------------------
physics:
  gravity: [0.0, 0.0, -9.81]   # 重力加速度 m/s^2
  friction: 0.8                # 静摩擦系数（影响抓取滑落概率）
  timestep: 0.002              # 仿真步长 s（MuJoCo 用；Mock 忽略）
  restitution: 0.1             # 恢复系数（碰撞回弹，影响放置掉落）
  # 抓取相关基础物理（失败注入模型会参考零件 fragile/size）
  grasp_force_max: 20.0        # 夹爪最大夹持力 N
  table_friction: 0.9          # 台面摩擦（零件初始稳定性）

# ----------------------------------------------------------------------------
# 渲染模式：realtime（GLFW 窗口，human）/ offscreen（离屏 rgb_array）
# env.render(mode) 优先 GLFW，失败降级离屏；Mock 用 matplotlib 合成图。
# ----------------------------------------------------------------------------
render:
  mode: "offscreen"            # 默认离屏，最稳（无显示环境也可跑）；可选 "realtime"
  width: 640                   # 渲染分辨率宽
  height: 480                  # 渲染分辨率高
  fps: 30                      # realtime 模式目标帧率
  retina_scale: 2.0            # Retina 高分屏缩放（Mac 友好）
  background_color: "#F5F7FA"  # 画面背景（看板浅灰底，专业 B 端风格）
  save_failure_png: true       # 失败案例是否保存俯视 PNG 到 data/failure_cases/

# ----------------------------------------------------------------------------
# 相机参数：俯视（top，主感知视角）+ 侧视（side，辅助）
# env.get_camera_image(view) 与 camera.py 据此渲染或合成。
# ----------------------------------------------------------------------------
camera:
  # 俯视相机：垂直向下看工作台，VLA 主输入视角
  top:
    name: "俯视相机"
    # 相机位置 [x, y, z]，正上方
    position: [0.0, 0.0, 1.20]
    # 看向目标点
    look_at: [0.0, 0.0, 0.0]
    # 上方向向量
    up: [0.0, 1.0, 0.0]
    fovy: 45.0                 # 垂直视场角（度）
    width: 640
    height: 480
    # 合成俯视图（Mock）映射的世界范围 [x_min, x_max, y_min, y_max]
    view_range: [-0.65, 0.65, -0.45, 0.45]

  # 侧视相机：从前方斜看，辅助展示堆叠/遮挡
  side:
    name: "侧视相机"
    position: [0.0, -0.90, 0.55]
    look_at: [0.0, 0.0, 0.10]
    up: [0.0, 0.0, 1.0]
    fovy: 50.0
    width: 640
    height: 480

# ----------------------------------------------------------------------------
# 后端资源路径（相对项目根；env.py 加载 scene.xml 失败时回退 Mock）
# ----------------------------------------------------------------------------
assets:
  scene_xml: "assets/models/scene.xml"          # MuJoCo 场景模型
  parts_catalog: "assets/objects/parts_catalog.json"  # 10 种零件目录镜像
  scenes_dir: "assets/scenes"                   # 预置难度场景 JSON 目录
